        window.saveData = async () => {
            if (window.currentUser) {
                await setDoc(doc(db, "tcf_users", window.currentUser.uid), {
                    progress: window.data,
                    settings: { attempts: window.attemptsCount }
                });
            } else {
                localStorage.setItem('tcf_pro_data', JSON.stringify(window.data));
                localStorage.setItem('tcf_attempts', window.attemptsCount);
            }
        };
    </script>

    <style>
        :root {
            --primary: #3b82f6; --success: #22c55e;
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0;
        }
        body.dark-mode {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: background 0.3s; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; }
        
        header { padding: 15px 0; text-align: center; position: relative; }
        .theme-btn { position: absolute; top: 10px; right: 0; background: var(--card); border: 1px solid var(--border); padding: 8px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        
        .progress-container { background: var(--border); border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
        .stats { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 15px; }

        .config-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        select, input[type="text"] { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        
        .btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; border: none; }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab.active { background: var(--primary); color: white; border: none; }

        .scroll-wrapper { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
        .grid-layout { display: grid; grid-template-columns: 60px repeat(var(--cols, 10), minmax(42px, 1fr)) 45px; min-width: fit-content; align-items: center; text-align: center; }
        .grid-header { font-size: 0.7rem; font-weight: bold; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
        .exercise-row { border-bottom: 1px solid var(--border); }
        .exercise-row.done { background: rgba(34, 197, 94, 0.05); }
        .sticky-col { position: sticky; left: 0; background: var(--card); z-index: 10; font-weight: bold; padding: 12px 5px; border-right: 1px solid var(--border); }
        .grid-header .sticky-col { background: var(--bg); }

        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; }
        .reset-row-btn { font-size: 16px; opacity: 0.3; cursor: pointer; background: none; border: none; color: var(--text); }
    </style>
</head>
<body class="dark-mode">

<div class="container">
    <header>
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        <h1>TCF Practice Tracker</h1>
        <div id="auth-section"></div>
        <div class="progress-container"><div id="main-progress" class="progress-bar"></div></div>
        <div class="stats"><span id="stat-text">0/0 (0%)</span> <span id="sync-status">● Offline</span></div>
    </header>

    <div class="config-row">
        <select id="attemptSelector" onchange="changeAttempts(this.value)">
            <option value="3">3 Attempts</option>
            <option value="5">5 Attempts</option>
            <option value="10" selected>10 Attempts</option>
        </select>
        <button class="btn" id="hideDoneBtn" onclick="toggleHideDone()">Show All</button>
    </div>
    
    <input type="text" id="searchInput" placeholder="Search Exercise # (e.g. 15)" oninput="render()" style="width: 100%; margin-bottom: 15px;">

    <div class="tabs">
        <button class="tab active" id="tabCE" onclick="setSection('CE')">CE (Reading)</button>
        <button class="tab" id="tabCO" onclick="setSection('CO')">CO (Listening)</button>
    </div>

    <div class="scroll-wrapper">
        <div id="grid-header" class="grid-header grid-layout"></div>
        <div id="exercise-list"></div>
    </div>
</div>

<script>
    window.section = 'CE';
    window.attemptsCount = 5;
    window.hideDone = false;
    window.data = {};

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('tcf_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('tcf_theme') === 'light') document.body.classList.remove('dark-mode');

    function changeAttempts(val) {
        window.attemptsCount = parseInt(val);
        window.saveData();
        render();
    }

    function setSection(s) {
        window.section = s;
        document.getElementById('tabCE').classList.toggle('active', s === 'CE');
        document.getElementById('tabCO').classList.toggle('active', s === 'CO');
        render();
    }

    function toggleHideDone() {
        window.hideDone = !window.hideDone;
        document.getElementById('hideDoneBtn').innerText = window.hideDone ? "Hiding Done" : "Show All";
        render();
    }

    function toggleBox(ex, att) {
        const key = `${ex}_${att}`;
        window.data[key] = !window.data[key];
        if (isRowDone(ex) && window.data[key]) confetti({ particleCount: 30, spread: 50, origin: { y: 0.9 } });
        window.saveData();
        render();
    }

    function isRowDone(ex) {
        for (let i = 1; i <= window.attemptsCount; i++) {
            if (!window.data[`${ex}_${i}`]) return false;
        }
        return true;
    }

    function resetRow(ex) {
        if (confirm(`Reset ${ex}?`)) {
            for (let i = 1; i <= 10; i++) delete window.data[`${ex}_${i}`];
            window.saveData();
            render();
        }
    }

    window.render = function() {
        document.getElementById('attemptSelector').value = window.attemptsCount;
        document.documentElement.style.setProperty('--cols', window.attemptsCount);
        document.getElementById('sync-status').innerHTML = window.currentUser ? '<span style="color:var(--success)">● Cloud Sync Active</span>' : '● Local Only';

        const header = document.getElementById('grid-header');
        let hHtml = `<div class="sticky-col">Ex.</div>`;
        for(let i=1; i<=window.attemptsCount; i++) hHtml += `<div>${i}</div>`;
        hHtml += `<div>🗑️</div>`;
        header.innerHTML = hHtml;

        const list = document.getElementById('exercise-list');
        const search = document.getElementById('searchInput').value;
        list.innerHTML = '';

        for (let i = 1; i <= 40; i++) {
            const exId = `${window.section}${i}`;
            const done = isRowDone(exId);
            if (window.hideDone && done) continue;
            if (search && !i.toString().includes(search)) continue;

            const row = document.createElement('div');
            row.className = `exercise-row grid-layout ${done ? 'done' : ''}`;
            let html = `<div class="sticky-col">${exId}</div>`;
            for (let a = 1; a <= window.attemptsCount; a++) {
                const checked = window.data[`${exId}_${a}`] ? 'checked' : '';
                html += `<div><input type="checkbox" ${checked} onchange="toggleBox('${exId}', ${a})"></div>`;
            }
            html += `<div><button class="reset-row-btn" onclick="resetRow('${exId}')">✕</button></div>`;
            row.innerHTML = html;
            list.appendChild(row);
        }
        updateProgress();
    }

    function updateProgress() {
        const total = 80 * window.attemptsCount;
        const current = Object.keys(window.data).filter(k => {
            const attNum = parseInt(k.split('_')[1]);
            return window.data[k] && attNum <= window.attemptsCount;
        }).length;
        const percent = Math.round((current / total) * 100) || 0;
        document.getElementById('main-progress').style.width = percent + '%';
        document.getElementById('stat-text').innerText = `${current}/${total} (${percent}%)`;
    }

    /* function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `tcf_backup.json`;
        a.click();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            data = JSON.parse(e.target.result);
            localStorage.setItem('tcf_pro_data', JSON.stringify(data));
            render();
        };
        reader.readAsText(event.target.files[0]);
    } */

    // Initialize the default CE view immediately. Previously this only happened
    // inside the commented-out authentication callback, so the grid stayed empty
    // until a tab or another control triggered render().
    window.data = JSON.parse(localStorage.getItem('tcf_pro_data')) || {};
    window.attemptsCount = parseInt(localStorage.getItem('tcf_attempts'), 10) || 5;
    render();
</script>
</body>
</html>
