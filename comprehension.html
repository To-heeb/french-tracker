<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCF Master Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #22c55e;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            padding-bottom: 50px;
            transition: background 0.3s, color 0.3s;
        }

        .container { width: 100%; max-width: 800px; margin: 0 auto; }

        header { padding: 20px 0; text-align: center; position: relative; }
        .theme-btn {
            position: absolute; top: 10px; right: 0;
            background: var(--card); border: 1px solid var(--border);
            padding: 8px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
        }

        .progress-container { background: var(--border); border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
        .stats { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 20px; }

        .config-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; background: var(--card); padding: 10px;
            border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem;
        }
        select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 5px; border-radius: 4px; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 10px; border-radius: 8px; width: 100%;
        }
        .btn {
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
        }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab.active { background: var(--primary); border-color: var(--primary); color: white; }

        /* SCROLL LOGIC */
        .scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            -webkit-overflow-scrolling: touch;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 60px repeat(var(--cols, 10), minmax(40px, 1fr)) 45px;
            min-width: fit-content; /* Forces width to accommodate all columns */
            align-items: center;
            text-align: center;
        }

        .grid-header {
            font-size: 0.7rem;
            font-weight: bold;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .exercise-row {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .exercise-row.done { background: rgba(34, 197, 94, 0.05); }

        /* STICKY COLUMN LOGIC */
        .sticky-col {
            position: sticky;
            left: 0;
            background: var(--card);
            z-index: 10;
            font-weight: bold;
            padding: 12px 5px;
            border-right: 1px solid var(--border);
        }
        
        .grid-header .sticky-col { background: var(--bg); }
        .exercise-row.done .sticky-col { background: inherit; color: var(--success); }

        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; }

        .reset-row-btn { font-size: 16px; opacity: 0.3; cursor: pointer; background: none; border: none; color: var(--text); }
        .reset-row-btn:hover { opacity: 1; color: #ef4444; }

        .backup-zone { margin-top: 30px; padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    </style>
</head>
<body class="dark-mode">

<div class="container">
    <header>
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        <h1>TCF Tracker</h1>
        <div class="progress-container"><div id="main-progress" class="progress-bar"></div></div>
        <div class="stats">
            <span id="stat-text">0/0 Completed</span>
            <span>Goal: 10 Reps</span>
        </div>
    </header>

    <div class="config-row">
        <span>Attempts per Series:</span>
        <select id="attemptSelector" onchange="changeAttempts(this.value)">
            <option value="3">3 Attempts</option>
            <option value="5">5 Attempts</option>
            <option value="10" selected>10 Attempts</option>
        </select>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search #..." oninput="render()">
        <button class="btn" id="hideDoneBtn" onclick="toggleHideDone()">Show All</button>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabCE" onclick="setSection('CE')">Reading (CE)</button>
        <button class="tab" id="tabCO" onclick="setSection('CO')">Listening (CO)</button>
    </div>

    <!-- WRAPPER FOR SCROLLING -->
    <div class="scroll-wrapper">
        <div id="grid-header" class="grid-header grid-layout"></div>
        <div id="exercise-list"></div>
    </div>

    <div class="backup-zone">
        <button class="btn" onclick="exportData()">📥 Backup</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">📤 Restore</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>
</div>

<script>
    let section = 'CE';
    let hideDone = false;
    let attemptsCount = parseInt(localStorage.getItem('tcf_attempts')) || 10;
    let data = JSON.parse(localStorage.getItem('tcf_pro_data')) || {};

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('tcf_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('tcf_theme') === 'light') document.body.classList.remove('dark-mode');

    function changeAttempts(val) {
        attemptsCount = parseInt(val);
        localStorage.setItem('tcf_attempts', attemptsCount);
        render();
    }

    function setSection(s) {
        section = s;
        document.getElementById('tabCE').classList.toggle('active', s === 'CE');
        document.getElementById('tabCO').classList.toggle('active', s === 'CO');
        render();
    }

    function toggleHideDone() {
        hideDone = !hideDone;
        document.getElementById('hideDoneBtn').innerText = hideDone ? "Hiding Finished" : "Show All";
        render();
    }

    function toggleBox(ex, att) {
        const key = `${ex}_${att}`;
        data[key] = !data[key];
        localStorage.setItem('tcf_pro_data', JSON.stringify(data));
        if (isRowDone(ex) && data[key]) {
            confetti({ particleCount: 30, spread: 50, origin: { y: 0.9 } });
        }
        updateProgress();
        render();
    }

    function isRowDone(ex) {
        for (let i = 1; i <= attemptsCount; i++) {
            if (!data[`${ex}_${i}`]) return false;
        }
        return true;
    }

    function resetRow(ex) {
        if (confirm(`Reset ${ex}?`)) {
            for (let i = 1; i <= 10; i++) delete data[`${ex}_${i}`];
            localStorage.setItem('tcf_pro_data', JSON.stringify(data));
            render();
        }
    }

    function render() {
        document.getElementById('attemptSelector').value = attemptsCount;
        document.documentElement.style.setProperty('--cols', attemptsCount);

        // Render Header
        const header = document.getElementById('grid-header');
        let headerHtml = `<div class="sticky-col">Ex.</div>`;
        for(let i=1; i<=attemptsCount; i++) headerHtml += `<div>${i}</div>`;
        headerHtml += `<div>🗑️</div>`;
        header.innerHTML = headerHtml;

        // Render List
        const list = document.getElementById('exercise-list');
        const search = document.getElementById('searchInput').value;
        list.innerHTML = '';

        for (let i = 1; i <= 40; i++) {
            const exId = `${section}${i}`;
            const done = isRowDone(exId);
            if (hideDone && done) continue;
            if (search && !i.toString().includes(search)) continue;

            const row = document.createElement('div');
            row.className = `exercise-row grid-layout ${done ? 'done' : ''}`;
            
            let html = `<div class="sticky-col">${exId}</div>`;
            for (let a = 1; a <= attemptsCount; a++) {
                const checked = data[`${exId}_${a}`] ? 'checked' : '';
                html += `<div><input type="checkbox" ${checked} onchange="toggleBox('${exId}', ${a})"></div>`;
            }
            html += `<div><button class="reset-row-btn" onclick="resetRow('${exId}')">✕</button></div>`;
            
            row.innerHTML = html;
            list.appendChild(row);
        }
        updateProgress();
    }

    function updateProgress() {
        const totalPossible = 80 * attemptsCount;
        const currentCount = Object.keys(data).filter(key => {
            const attNum = parseInt(key.split('_')[1]);
            return data[key] && attNum <= attemptsCount;
        }).length;
        const percent = totalPossible > 0 ? Math.round((currentCount / totalPossible) * 100) : 0;
        document.getElementById('main-progress').style.width = percent + '%';
        document.getElementById('stat-text').innerText = `${currentCount}/${totalPossible} (${percent}%)`;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `tcf_backup.json`;
        a.click();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            data = JSON.parse(e.target.result);
            localStorage.setItem('tcf_pro_data', JSON.stringify(data));
            render();
        };
        reader.readAsText(event.target.files[0]);
    }

    render();
</script>

</body>
</html>
