<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>French Daily Pro</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --bg-glow: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --border: rgba(255,255,255,0.1);
            --border-soft: rgba(255,255,255,0.05);
            --muted-bg: rgba(255,255,255,0.05);
            --completed-bg: rgba(30, 41, 59, 0.3);
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --bg: #f1f5f9;
            --bg-glow: #dbeafe;
            --card-bg: rgba(255, 255, 255, 0.78);
            --accent: #0284c7;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --border: rgba(15,23,42,0.1);
            --border-soft: rgba(15,23,42,0.08);
            --muted-bg: rgba(255,255,255,0.65);
            --completed-bg: rgba(226, 232, 240, 0.65);
            color-scheme: light;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, var(--bg-glow), var(--bg));
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) 20px 40px;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .app-container { width: 100%; max-width: 450px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .theme-toggle {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.05rem;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .theme-toggle:hover { transform: translateY(-1px); }
        .theme-toggle:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }

        .streak-badge {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* Progress Section */
        .progress-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-text h2 { margin: 0; font-size: 1.2rem; }
        .progress-text p { margin: 5px 0 0; color: var(--text-dim); font-size: 0.85rem; }

        .progress-circle { position: relative; width: 60px; height: 60px; }
        svg { transform: rotate(-90deg); width: 60px; height: 60px; }
        circle { fill: none; stroke-width: 6; stroke-linecap: round; }
        .bg-circle { stroke: var(--border); }
        .fg-circle {
            stroke: var(--accent);
            stroke-dasharray: 170;
            stroke-dashoffset: 170;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* List Items */
        .task-list { display: flex; flex-direction: column; gap: 10px; }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .checkbox {
            width: 24px; height: 24px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            margin-right: 15px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }

        .task-card.completed {
            background: var(--completed-bg);
            opacity: 0.6;
        }

        .task-card.completed .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .task-card.completed .checkbox::after {
            content: '✓'; color: white; font-weight: bold; font-size: 14px;
        }

        .task-card.completed .task-label { text-decoration: line-through; }

        .task-label { font-size: 1rem; font-weight: 500; }

        .reset-btn {
            margin-top: 40px;
            width: 100%;
            background: var(--muted-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>French Daily</h1>
        <div class="header-actions">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">☀️</button>
            <div class="streak-badge" id="streak-display">🔥 0 Days</div>
        </div>
    </header>

    <div class="progress-section">
        <div class="progress-text">
            <h2 id="progress-percent">0%</h2>
            <p id="progress-count">Ready to start?</p>
        </div>
        <div class="progress-circle">
            <svg><circle class="bg-circle" cx="30" cy="30" r="27"></circle><circle class="fg-circle" id="circle-bar" cx="30" cy="30" r="27"></circle></svg>
        </div>
    </div>

    <div id="list" class="task-list"></div>

    <button class="reset-btn" onclick="resetTasks()">New Day Reset</button>
</div>

<script>
    const tasks = ["writing", "speaking", "tcf questions", "conjugation", "madame omolola", "french class", "work learning", "anki", "class with babe", "night class", "listening"];

    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('frenchTheme');
    const initialTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

    function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const isLight = theme === 'light';
        themeToggle.textContent = isLight ? '🌙' : '☀️';
        themeToggle.setAttribute('aria-label', `Switch to ${isLight ? 'dark' : 'light'} mode`);
        themeToggle.title = `Switch to ${isLight ? 'dark' : 'light'} mode`;
    }

    themeToggle.addEventListener('click', () => {
        const nextTheme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        localStorage.setItem('frenchTheme', nextTheme);
        setTheme(nextTheme);
    });

    setTheme(initialTheme);

    function updateUI() {
        const savedState = JSON.parse(localStorage.getItem('frenchTasks')) || {};
        const streak = localStorage.getItem('frenchStreak') || 0;
        const listContainer = document.getElementById('list');
        
        document.getElementById('streak-display').innerText = `🔥 ${streak} Days`;

        const sortedTasks = [...tasks].sort((a, b) => (savedState[a] === savedState[b]) ? 0 : savedState[a] ? 1 : -1);
        listContainer.innerHTML = '';
        
        let completedCount = 0;
        sortedTasks.forEach(task => {
            const isChecked = savedState[task] || false;
            if (isChecked) completedCount++;
            const card = document.createElement('div');
            card.className = `task-card ${isChecked ? 'completed' : ''}`;
            card.innerHTML = `<div class="checkbox"></div><div class="task-label">${task}</div>`;
            card.onclick = () => toggleTask(task);
            listContainer.appendChild(card);
        });

        const percent = Math.round((completedCount / tasks.length) * 100);
        document.getElementById('progress-percent').innerText = `${percent}% Done`;
        document.getElementById('progress-count').innerText = `${completedCount} of ${tasks.length} completed`;
        document.getElementById('circle-bar').style.strokeDashoffset = 170 - (170 * percent / 100);

        if (percent === 100) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#38bdf8', '#818cf8', '#22c55e'] });
        }
    }

    function toggleTask(taskName) {
        if (window.navigator.vibrate) window.navigator.vibrate(10); // Haptic
        const savedState = JSON.parse(localStorage.getItem('frenchTasks')) || {};
        savedState[taskName] = !savedState[taskName];
        localStorage.setItem('frenchTasks', JSON.stringify(savedState));
        setTimeout(updateUI, 100);
    }

    function resetTasks() {
        if (confirm("Clear for a new day?")) {
            const savedState = JSON.parse(localStorage.getItem('frenchTasks')) || {};
            const completedAll = tasks.every(t => savedState[t]);
            
            if (completedAll) {
                let streak = parseInt(localStorage.getItem('frenchStreak') || 0);
                localStorage.setItem('frenchStreak', streak + 1);
            }
            
            localStorage.removeItem('frenchTasks');
            updateUI();
        }
    }

    updateUI();
</script>
</body>
</html>
